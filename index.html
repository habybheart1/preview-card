<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Frontend Mentor | Stats preview card component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#090b1a] text-white font-['Inter'] min-h-screen flex items-center justify-center">
    <div class="bg-[#1c1a38] grid grid-row-3 md:grid-cols-2 md:grid-rows-[2fr_1fr] md:max-w-4xl rounded-lg overflow-hidden mx-6 md:mx-0 my-10 md:my-0">
      <div class="row-start-2 md:row-start-1 col-start-1 flex flex-col justify-center items-center gap-6 p-10">
        <h1 class="text-3xl font-['Lexend_Deca'] font-semibold text-center md:text-left">
          Get <span class="text-[#aa5cdb]">insights</span> that help your
          business grow.
        </h1>
        <p class="font-['Lexend_Deca'] text-sm font-light text-[#ffffff99] text-center md:text-left">
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </p>
      </div>

      <div class="row-start-3 md:col-start-1 md:row-start-2 md:flex md:flex-row md:gap-6 justify-center text-center md:mx-0 md:justify-start md:mx-10">
        <div class="font-['Lexend_Deca'] mb-3">
          <h2 class="text-xl font-semibold pb-1 text-left">10k+</h2>
          <p class="text-[#ffffff99] font-[Lexend_Deca] uppercase text-xs tracking-wider">companies</p>
        </div>
        <div class="font-['Lexend_Deca'] mb-3">
          <h2 class="text-xl font-semibold pb-1 text-left">314</h2>
          <p class="text-[#ffffff99] font-[Lexend_Deca] uppercase text-xs tracking-wider">templates</p>
        </div>
        <div class="font-['Lexend_Deca'] mb-5">
          <h2 class="text-xl font-semibold pb-1 text-left">12m+</h2>
          <p class="text-[#ffffff99] font-[Lexend_Deca] uppercase text-xs tracking-wider">queries</p>
        </div>
      </div>
      <!-- <img src="./images/image-header-mobile.jpg" alt="Header image"> -->
      <img
        src="./images/image-header-desktop.jpg"
        alt="Header image"
        class="md:col-start-2 row-start-1 md:row-span-2 block w-full h-full object-cover"
      />
    </div>
  </body>
</html>
